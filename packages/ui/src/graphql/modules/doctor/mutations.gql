mutation UpdateDoctor($updateDoctorInput: UpdateDoctorInput!) {
  updateDoctor(updateDoctorInput: $updateDoctorInput) {
    id
  }
}

mutation CreateDoctorAvailability(
  $createDoctorAvailabilityInput: CreateDoctorAvailabilityInput!
) {
  createDoctorAvailability(createDoctorAvailabilityInput: $createDoctorAvailabilityInput) {
    id
    dayOfWeek
    startTime
    endTime
    timezone
    isActive
    createdAt
    updatedAt
  }
}

mutation RemoveDoctorAvailability($id: ID!) {
  removeDoctorAvailability(id: $id)
}
